name: Build Installers

on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset_name: TBXConverterWizard-Windows.exe
          - os: macos-latest
            asset_name: TBXConverterWizard-macOS.zip
          - os: ubuntu-latest
            asset_name: TBXConverterWizard-Linux.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Build macOS icon (icns)
        if: matrix.os == 'macos-latest'
        run: |
          mkdir icon.iconset
          sips -z 16 16   packaging/icons/icon.png --out icon.iconset/icon_16x16.png
          sips -z 32 32   packaging/icons/icon.png --out icon.iconset/icon_16x16@2x.png
          sips -z 32 32   packaging/icons/icon.png --out icon.iconset/icon_32x32.png
          sips -z 64 64   packaging/icons/icon.png --out icon.iconset/icon_32x32@2x.png
          sips -z 128 128 packaging/icons/icon.png --out icon.iconset/icon_128x128.png
          sips -z 256 256 packaging/icons/icon.png --out icon.iconset/icon_128x128@2x.png
          sips -z 256 256 packaging/icons/icon.png --out icon.iconset/icon_256x256.png
          sips -z 512 512 packaging/icons/icon.png --out icon.iconset/icon_256x256@2x.png
          cp packaging/icons/icon.png icon.iconset/icon_512x512.png
          iconutil -c icns icon.iconset -o packaging/icons/icon.icns
          rm -rf icon.iconset

      - name: Build with PyInstaller
        run: pyinstaller packaging/tbx_converter_wizard.spec

      - name: Package Windows artifact
        if: matrix.os == 'windows-latest'
        run: Copy-Item dist/TBXConverterWizard.exe ${{ matrix.asset_name }}
        shell: pwsh

      - name: Package macOS artifact
        if: matrix.os == 'macos-latest'
        run: ditto -c -k --sequesterRsrc --keepParent "dist/TBX Converter Wizard.app" ${{ matrix.asset_name }}

      - name: Package Linux artifact
        if: matrix.os == 'ubuntu-latest'
        run: tar -czf ${{ matrix.asset_name }} -C dist TBXConverterWizard

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create/update release with artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
